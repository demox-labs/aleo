[package]
name = "aleo-wasm"
version = "1.0.2"
authors = ["The Team"]
description = "WebAssembly based toolkit for developing zero knowledge applications with Aleo"
homepage = "https://aleo.org"
repository = "https://github.com/AleoHQ/sdk"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge",
]
categories = ["cryptography::cryptocurrencies"]
include = ["Cargo.toml", "src", "README.md", "LICENSE.md"]
license = "GPL-3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies.snarkvm-algorithms]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"

[dependencies.snarkvm-circuit-network]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"

[dependencies.snarkvm-console]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
default-features = false
features = [
  "account",
  "algorithms",
  "collections",
  "network",
  "program",
  "types",
  "wasm"
]

[dependencies.snarkvm-fields]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"

[dependencies.snarkvm-ledger-block]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
features = ["wasm"]

[dependencies.snarkvm-ledger-query]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
features = ["async", "wasm"]

[dependencies.snarkvm-ledger-store]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"

[dependencies.snarkvm-parameters]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
features = ["wasm"]

[dependencies.snarkvm-synthesizer-program]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
features = ["wasm"]

[dependencies.snarkvm-synthesizer]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
features = ["async", "wasm"]

[dependencies.snarkvm-wasm]
git = "https://github.com/ProvableHQ/snarkVM-forked-demox"
rev = "eed7f884a7f0619bab8a6dd737b421f5b9163ba3"
features = ["fields", "utilities"]

[dependencies.anyhow]
version = "1.0"

[dependencies.async-trait]
version = "0.1.68"

[dependencies.console_error_panic_hook]
version = "0.1.7"

[dependencies.getrandom]
version = "0.2"
features = ["js"]

# snarkVM v4.7 pulls `rand 0.10`, which depends on `getrandom 0.4`. On wasm32 that backend must be
# opted into the JS-based source via the `wasm_js` feature plus `--cfg getrandom_backend="wasm_js"`
# (the latter is set in rollup.config.js build rustflags).
[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom_v04]
package = "getrandom"
version = "0.4"
features = ["wasm_js"]

[dependencies.indexmap]
version = "2.0.0"

[dependencies.hex]
version = "0.4.3"

[dependencies.js-sys]
version = "0.3"

[dependencies.once_cell]
version = "1.18.0"

[dependencies.rand]
version = "0.10"

[dependencies.rayon]
version = "1.8"

[dependencies.reqwest]
version = "0.13"

[dependencies.serde]
version = "1.0.183"

[dependencies.serde_json]
version = "1.0"

[dependencies.sha2]
version = "0.10"
default-features = false

[build-dependencies.walkdir]
version = "2"

[dependencies.wasm-bindgen]
version = "0.2"
features = ["serde-serialize"]

[dependencies.wasm-bindgen-futures]
version = "0.4.37"

[dependencies.spmc]
version = "0.3.0"

[dependencies.futures]
version = "0.3.28"

[dependencies.web-sys]
version = "0.3.64"
features = ["Url", "Navigator", "Window"]

[dev-dependencies.wasm-bindgen-test]
version = "0.3.37"

[features]
default = ["serial", "browser"]
serial = [
  "snarkvm-console/serial",
  "snarkvm-synthesizer/serial",
  "snarkvm-ledger-query/serial",
  "snarkvm-ledger-block/serial",
  "snarkvm-ledger-store/serial",
]
browser = []

## Profiles
[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 3
lto = "thin"
incremental = true
